services:
  # 1. Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: u44tech-db
    restart: always 
    profiles: ["infra", "backend", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-u44admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-u44password}
      POSTGRES_DB: ${POSTGRES_DB:-u44tech_v2}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend: NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: u44tech-backend
    restart: always
    profiles: ["backend", "full"]
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-u44admin}:${POSTGRES_PASSWORD:-u44password}@postgres:5432/${POSTGRES_DB:-u44tech_v2}}
      JWT_SECRET: ${JWT_SECRET:-u44supersecret}
      PORT: ${PORT:-4000}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
    depends_on:
      - postgres

  # 3. Frontend: Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: u44tech-frontend
    restart: always
    profiles: [ "full"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL:-http://localhost:8080}
    depends_on:
      - backend

  # 4. Static File Server: Nginx
  nginx:
    image: nginx:alpine
    container_name: u44tech-nginx
    restart: always
    profiles: ["full", "infra", "backend"]
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:

