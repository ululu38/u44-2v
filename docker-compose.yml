services:
  # 1. Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: u44tech-db
    restart: always 
    profiles: ["infra", "backend", "full"]
    environment:
      POSTGRES_USER: u44admin
      POSTGRES_PASSWORD: u44password
      POSTGRES_DB: u44tech_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend: NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: u44tech-backend
    restart: always
    profiles: ["backend", "full"]
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://u44admin:u44password@postgres:5432/u44tech_v2
      - JWT_SECRET=u44supersecret
    depends_on:
      - postgres

  # 3. Frontend: Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: u44tech-frontend
    restart: always
    profiles: [ "full"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

  # 4. Static File Server: Nginx
  nginx:
    image: nginx:alpine
    container_name: u44tech-nginx
    restart: always
    profiles: ["full", "infra", "backend"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
