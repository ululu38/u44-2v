services:
  # 1. Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: u44tech-db
    restart: always
    profiles: ["db", "full"] # รันเมื่อใช้ profile db หรือ full
    environment:
      POSTGRES_USER: u44admin
      POSTGRES_PASSWORD: u44password
      POSTGRES_DB: u44tech_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Search Engine: Meilisearch
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: u44tech-search
    restart: always
    profiles: ["db", "full"]
    environment:
      - MEILI_MASTER_KEY=u44masterkey
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  # 3. Backend: NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: u44tech-backend
    restart: always
    profiles: ["app", "full"] # รันเมื่อใช้ profile app หรือ full
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://u44admin:u44password@postgres:5432/u44tech_v2
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_KEY=u44masterkey
      - JWT_SECRET=u44supersecret
    depends_on:
      - postgres
      - meilisearch

  # 4. Frontend: Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: u44tech-frontend
    restart: always
    profiles: ["app", "full"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_MEILI_HOST=http://localhost:7700
      - NEXT_PUBLIC_MEILI_KEY=u44masterkey
    depends_on:
      - backend

volumes:
  postgres_data:
  meilisearch_data:
